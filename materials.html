<!DOCTYPE html>
<html>

<head>
    <title>Materials</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>

    <!-- สำหรับโมเดล Meshopt -->
    <script src="https://cdn.jsdelivr.net/npm/meshoptimizer@0.18.1/meshopt_decoder.js"></script>

    <script>

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        camera.position.set(0, 2, 5);
        camera.lookAt(0, 0, 0);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // แสง
        const abmientLight = new THREE.AmbientLight(0x404040, 1);
        scene.add(abmientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(10, 10, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);


   
        const exrSkyboxUrl =
            'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/venice_sunset_1k.exr';

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(
                exrSkyboxUrl,
                (texture) => {

                    const skybox =
                        pmremGenerator.fromEquirectangular(texture).texture;

                    //scene.background = skybox;
                    scene.environment = skybox;

                    texture.dispose();
                    pmremGenerator.dispose();

                },
                undefined,
                (error) => {
                    console.error('Unable to load EXR skybox:', error);
                }
            );


        // ใส่พื้น
        const texFloor = new THREE.TextureLoader().load(
            'https://sibsansuk.github.io/mossy_cobblestone_diff_1k.jpg'
        );

        const matFloor = new THREE.MeshStandardMaterial({
            map: texFloor,
            side: THREE.DoubleSide
        });

        const planeGeometry = new THREE.PlaneGeometry(10, 10);
        const plane = new THREE.Mesh(planeGeometry, matFloor);

        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;

        scene.add(plane);


        // load glb และใช้ pbr material
        MeshoptDecoder.ready.then(() => {

            const loader = new THREE.GLTFLoader();

            loader.setMeshoptDecoder(MeshoptDecoder);

            loader.load(
                'https://cdn.jsdelivr.net/gh/sutphat/interactive-graphics@main/tripo_pbr_model_ea6a4b74-4f1b-4e68-86a9-922ad23468e2_meshopt.glb',

                (gltf) => {

                    const model = gltf.scene;

                    model.traverse((child) => {

                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }

                    });

                    // ตำแหน่งโมเดล
                    model.position.set(0, 0, 0);

                    scene.add(model);


                    // หาขอบของโมเดล
                    const box = new THREE.Box3().setFromObject(model);

                    // ยกโมเดลให้ก้นอยู่บนพื้น y = 0
                    model.position.y -= box.min.y;

                },

                undefined,

                (error) => {
                    console.error('โหลดโมเดลไม่ได้:', error);
                }

            );

        });


        function animate() {

            controls.update();

            renderer.render(scene, camera);

            requestAnimationFrame(animate);

        }

        animate();


    
        window.addEventListener('resize', () => {

            camera.aspect =
                window.innerWidth / window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        });

    </script>

</body>

</html>
