<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Gen Rendering</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        #simple-gui {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
            padding: 10px 15px;
            border-radius: 4px;
            color: #333;
            font-size: 13px;
            z-index: 100;
        }

        #simple-gui h4 {
            margin: 0 0 10px 0;
            padding-bottom: 5px;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }

        .control-row {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .control-row label {
            font-weight: bold;
        }

        .control-row input[type="range"] {
            width: 100px;
        }
    </style>
</head>

<body>

    <div id="simple-gui">
        <h4>Light Controls</h4>
        <div class="control-row">
            <label>Light X:</label>
            <input type="range" id="lightX" min="-15" max="15" step="0.1" value="5">
            <span id="val-lightX">5</span>
        </div>
        <div class="control-row">
            <label>Light Y:</label>
            <input type="range" id="lightY" min="1" max="20" step="0.1" value="8">
            <span id="val-lightY">8</span>
        </div>
        <div class="control-row">
            <label>Light Z:</label>
            <input type="range" id="lightZ" min="-15" max="15" step="0.1" value="5">
            <span id="val-lightZ">5</span>
        </div>

        <h4>PBR Material Controls</h4>
        <div class="control-row">
            <label>Base Color:</label>
            <input type="color" id="baseColor" value="#ffffff">
        </div>
        <div class="control-row">
            <label>Metallic:</label>
            <input type="range" id="metallic" min="0" max="1" step="0.01" value="0.5">
            <span id="val-metallic">0.5</span>
        </div>
        <div class="control-row">
            <label>Roughness:</label>
            <input type="range" id="roughness" min="0" max="1" step="0.01" value="0.5">
            <span id="val-roughness">0.5</span>
        </div>
    </div>

    <!-- Core Three.js Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/meshoptimizer@0.18.1/meshopt_decoder.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let ambientLight, directionalLight, lightHelper;
        let characterMaterials = [];

        function main() {
            initScene();
            setupLighting();
            setupEnvironment();
            setupFloor();
            setupStructures();
            load3DModel();
            setupGUI();

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function initScene() {
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            document.body.appendChild(renderer.domElement);

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
        }

        function setupLighting() {
            ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(5, 8, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.bias = -0.0001;
            scene.add(directionalLight);

            lightHelper = new THREE.Mesh(
                new THREE.SphereGeometry(0.1, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0xffff00 })
            );
            scene.add(lightHelper);
        }

        function setupEnvironment() {
            const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/venice_sunset_1k.exr';
            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            pmremGenerator.compileEquirectangularShader();

            new THREE.EXRLoader()
                .setDataType(THREE.UnsignedByteType)
                .load(exrSkyboxUrl, (texture) => {
                    const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                    scene.background = skybox;
                    scene.environment = skybox;
                    texture.dispose();
                    pmremGenerator.dispose();
                });
        }

        function setupFloor() {
            const texLoader = new THREE.TextureLoader();
            const texFloor = texLoader.load('https://sibsansuk.github.io/mossy_cobblestone_diff_1k.jpg');
            
            texFloor.wrapS = THREE.RepeatWrapping;
            texFloor.wrapT = THREE.RepeatWrapping;
            texFloor.repeat.set(4, 4);

            const matFloor = new THREE.MeshStandardMaterial({
                map: texFloor,
                side: THREE.DoubleSide,
                roughness: 0.7,
                metalness: 0.1
            });

            const plane = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), matFloor);
            plane.rotation.x = -Math.PI / 2;
            plane.receiveShadow = true;
            scene.add(plane);
        }

        
       function setupStructures() {
            MeshoptDecoder.ready.then(() => {
                const loader = new THREE.GLTFLoader();
                loader.setMeshoptDecoder(MeshoptDecoder);

                const bgModelUrl = 'https://cdn.jsdelivr.net/gh/sutphat/interactive-graphics@main/brick_wall_broken.glb';

                loader.load(bgModelUrl, (gltf) => {
                    const bgModel = gltf.scene;

                    bgModel.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });

            
                    bgModel.scale.set(3.5, 3.5, 3.5);

                    bgModel.position.set(0, 2.3, -2.0); 

                    scene.add(bgModel);
                });
            });
        }
function load3DModel() {
            MeshoptDecoder.ready.then(() => {
                const loader = new THREE.GLTFLoader();
                loader.setMeshoptDecoder(MeshoptDecoder);

                const modelUrl = 'https://cdn.jsdelivr.net/gh/sutphat/interactive-graphics@main/tripo_pbr_model_ea6a4b74-4f1b-4e68-86a9-922ad23468e2_meshopt.glb';

                loader.load(modelUrl, (gltf) => {
                    const model = gltf.scene;

                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;

                            if (child.material) {
                                
                                child.material.metalnessMap = null;
                                child.material.roughnessMap = null;
                                
                                // ตั้งค่าให้เป็นโลหะเงาวับเหมือนกระจกเพื่อโชว์ HDRI
                                child.material.metalness = 1.0;          
                                child.material.roughness = 0.05;         
                                child.material.envMapIntensity = 2.5;    
                                
                                child.material.needsUpdate = true;

                                if (!characterMaterials.includes(child.material)) {
                                    characterMaterials.push(child.material);
                                }
                            }
                        }
                    });

                    model.scale.set(2.5, 2.5, 2.5);
                    model.position.set(0, 0, 0);
                    model.rotation.y = -Math.PI / 2;
                    scene.add(model);

                    const box = new THREE.Box3().setFromObject(model);
                    model.position.y -= box.min.y;

                    syncGUIWithMaterial();
                });
            });
        }

        function bindControl(id, valId, callback) {
            const elem = document.getElementById(id);
            const valSpan = document.getElementById(valId);
            elem.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                if (valSpan) valSpan.innerText = val;
                callback(val);
            });
        }

        function setupGUI() {
            bindControl('lightX', 'val-lightX', v => directionalLight.position.x = v);
            bindControl('lightY', 'val-lightY', v => directionalLight.position.y = v);
            bindControl('lightZ', 'val-lightZ', v => directionalLight.position.z = v);

            bindControl('metallic', 'val-metallic', v => {
                characterMaterials.forEach(m => m.metalness = v);
            });

            bindControl('roughness', 'val-roughness', v => {
                characterMaterials.forEach(m => m.roughness = v);
            });

            document.getElementById('baseColor').addEventListener('input', (e) => {
                characterMaterials.forEach(m => m.color.set(e.target.value));
            });
        }

        function syncGUIWithMaterial() {
            if (characterMaterials.length > 0) {
                const mat = characterMaterials[0];
                if (mat.color) {
                    document.getElementById('baseColor').value = '#' + mat.color.getHexString();
                }
                if (mat.metalness !== undefined) {
                    document.getElementById('metallic').value = mat.metalness;
                    document.getElementById('val-metallic').innerText = mat.metalness;
                }
                if (mat.roughness !== undefined) {
                    document.getElementById('roughness').value = mat.roughness;
                    document.getElementById('val-roughness').innerText = mat.roughness;
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            lightHelper.position.copy(directionalLight.position);
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        main();
    </script>
</body>

</html>
